name: image-sign

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  docker-build-and-scan:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag output
        id: vars
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t streamgen-ai:${{ steps.vars.outputs.TAG }} \
            --load .

      - name: Save docker artifact
        run: docker save streamgen-ai:${{ steps.vars.outputs.TAG }} -o streamgen-ai.tar

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamgen-ai
          path: streamgen-ai.tar
    
  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs: [docker-build-and-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: streamgen-ai
        
      - name: Load docker
        run: docker load -i streamgen-ai.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }} ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}
          docker push ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}

  sign-image:
    name: Image signing & verification
    runs-on: ubuntu-latest
    needs: [deploy, docker-build-and-scan]

    steps:
        - name: Install Cosign
          uses: sigstore/cosign-installer@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Write private key
          run: echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

        - name: Write public key
          run: echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > cosign.pub

        - name: Sign the published Docker image
          env:
            COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          run: |
            cosign sign \
            --yes \
            --key cosign.key \
            ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}

        - name: Verify the signed image
          run: |
            cosign verify \
            --key cosign.pub \
            ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}
