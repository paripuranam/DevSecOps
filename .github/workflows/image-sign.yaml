name: image-sign

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  docker-build-and-scan:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag output
        id: vars
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t streamgen-ai:${{ steps.vars.outputs.TAG }} \
            --load .

      - name: Save docker artifact
        run: docker save streamgen-ai:${{ steps.vars.outputs.TAG }} -o streamgen-ai.tar

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamgen-ai
          path: streamgen-ai.tar

  sign-image:
    name: Image signing
    runs-on: ubuntu-latest
    needs: docker-build-and-scan

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: streamgen-ai

      - name: Load Docker image
        run: docker load -i streamgen-ai.tar

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (keyless)
        run: cosign sign --yes streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}

      - name: Verify Image (keyless)
        run: |
            cosign verify \
            --certificate-identity ${{ github.actor }} \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}
