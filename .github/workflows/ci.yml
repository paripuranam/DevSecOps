name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - kubernetes/**
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    

jobs:
  # Secrets scanning
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Run Gitleaks (full git history)
        run: gitleaks detect --source . -v --config .gitleaks.toml --redact --exit-code 0 --log-opts="--all"
        continue-on-error: true

      - name: Run Gitleaks (repository files)
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --exit-code 0
        continue-on-error: true

  # Unit testing
  test:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Build & Initial Security Scans

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [test, secret-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

  # Source Code & Dependency Scanning (Parallel after Build)

  sonarqube-scan:
    name: SonarQube SAST Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=devsecops-ci-key
            -Dsonar.organization=paripuranam

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          #continue-on-error: true

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high || true
        # continue-on-error: true

      - name: Run Snyk Dependency Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=medium
  
  # IaC Scanning

  iac-scan-checkov:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: false
          output_format: json
          output_file_path: terraform-checkov-report.json
          continue-on-error: true
        continue-on-error: true

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report
          path: terraform-checkov-report.json
        continue-on-error: true

  # Docker Build & Container Security

  docker-build-and-scan:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: dependency-scan
    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set image tag output
        id: vars
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max -t streamgen-ai:${{ steps.vars.outputs.TAG }} --load .

      - name: Save docker artifact
        run: docker save streamgen-ai:${{ steps.vars.outputs.TAG }} -o streamgen-ai.tar

      - name: Uploading artifact
        uses: actions/upload-artifact@v7
        with:
          name: streamgen-ai
          path: streamgen-ai.tar

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: streamgen-ai:${{ steps.vars.outputs.TAG }}
          format: table
          # exit-code: 1
          # severity: CRITICAL,HIGH

      - name: Snyk Container Scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: streamgen-ai:${{ steps.vars.outputs.TAG }}
          args: --severity-threshold=medium

  # SBOM Generation & Scanning

  sbom-generate:
    name: SBOM Generation (Syft)
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag output
        id: vars
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: streamgen-ai

      - name: Load Docker image
        run: docker load -i streamgen-ai.tar

      - name: Install Syft
        run: |
          SYFT_VERSION="1.0.1"
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM (SPDX)
        run: |
          syft streamgen-ai:${{ steps.vars.outputs.TAG }} -o spdx-json > streamgen-ai-sbom.spdx.json
          syft streamgen-ai:${{ steps.vars.outputs.TAG }} -o cyclonedx-json > streamgen-ai-sbom.cdx.json

      # - name: SBOM Generate (SPDX)
      #   run: |
      #     docker pull anchore/syft:v1.42.1-debug 
      #     docker run --rm -v "${PWD}:/work" anchore/syft:v1.42.1-debug syft streamgen-ai:${{ steps.vars.outputs.TAG }} -o spdx-json > streamgen-ai-sbom.spdx.json 

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-reports
          path: |
            streamgen-ai-sbom.spdx.json
            streamgen-ai-sbom.cdx.json

  sbom-scan:
    name: SBOM Scan (Grype)
    runs-on: ubuntu-latest
    needs: sbom-generate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Install Grype
      #   run: |
      #     GRYPE_VERSION="0.77.0"
      #     curl -sSL "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -o grype.tar.gz
      #     mkdir -p "$RUNNER_TEMP/bin"
      #     tar -xzf grype.tar.gz -C "$RUNNER_TEMP/bin" grype
      #     echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      #     grype version

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-reports

      # - name: Scan SBOM with Grype
      #   run: |
      #     grype sbom:streamgen-ai-sbom.spdx.json -o json > grype-report.json
      #     grype sbom:streamgen-ai-sbom.spdx.json -o table
      #   continue-on-error: true
      - name: Scan SBOM with Grype
        run: |
          docker pull anchore/grype:v0.77.0-debug
          docker run --rm -v "${PWD}:/work" anchore/grype:v0.77.0-debug /work/streamgen-ai-sbom.spdx.json -o json > grype-report.json
          docker run --rm -v "${PWD}:/work" anchore/grype:v0.77.0-debug /work/streamgen-ai-sbom.spdx.json -o table
        continue-on-error: true
        
      - name: Upload Grype Report
        uses: actions/upload-artifact@v7
        with:
          name: grype-report
          path: grype-report.json

  # DAST Testing

  zap-dast:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: docker-build-and-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: streamgen-ai

      - name: Load Docker image
        run: docker load -i streamgen-ai.tar

      - name: Start application
        run: |
          docker run -d --name app -p 3000:80 streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}
          echo "Waiting for app..."
          for i in {1..60}; do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "App is ready!"
              break
            fi
            echo "Attempt $i: Application not ready, retrying..."
            sleep 2
          done

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3000"
          artifact_name: "zap_report"
          allow_issue_writing: false
          # fail_action: true
          cmd_options: -J report_json.json -w report_md.md -r report_html.html --autooff

  # Deployment & Image Signing

  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs: [iac-scan-checkov, sbom-scan, zap-dast, docker-build-and-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: streamgen-ai
        
      - name: Load docker
        run: docker load -i streamgen-ai.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }} ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}
          docker push ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}
  sign-image:
    name: Image signing & verification
    runs-on: ubuntu-latest
    needs: [deploy, docker-build-and-scan]
    if: github.ref == 'refs/heads/main'

    steps:
        - name: Install Cosign
          uses: sigstore/cosign-installer@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Write private key
          run: echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

        - name: Write public key
          run: echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > cosign.pub

        - name: Sign the published Docker image
          env:
            COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          run: |
            cosign sign \
            --yes \
            --key cosign.key \
            ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}

        - name: Verify the signed image
          run: |
            cosign verify \
            --key cosign.pub \
            ${{ secrets.DOCKER_USERNAME }}/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}

  update-k8s:
    name: Update Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: [deploy, docker-build-and-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
      
      - name: Setup Git config
        run: |
          git config user.name "paripuranam"
          git config user.email "paripuranam333@gmail.com"
      
      - name: Update Kubernetes deployment file
        env:
          NEW_IMAGE: paripuranam/streamgen-ai:${{ needs.docker-build-and-scan.outputs.image_tag }}
        run: |
          echo "Updating deployment to image: $NEW_IMAGE"

          sed -i "s|image: .*|image: ${NEW_IMAGE}|g" kubernetes/deployment.yaml
          
          echo "Updated deployment file:"
          grep "image:" kubernetes/deployment.yaml
      
      - name: Commit and push changes
        run: |
          git add kubernetes/deployment.yaml
          git commit -m "Update Kubernetes deployment with new image tag: ${{ needs.docker-build-and-scan.outputs.image_tag }}" || echo "No changes to commit"
          git push
