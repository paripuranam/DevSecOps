<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1250" viewBox="0 0 1700 1250" role="img" aria-label="StreamGen AI pipeline stages flowchart">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 36px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .stage { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 14; ry: 14; }
      .stageSec { fill: #fff7ed; stroke: #c2410c; }
      .stageDeploy { fill: #ecfeff; stroke: #0e7490; }
      .stageInfra { fill: #eef2ff; stroke: #4338ca; }
      .name { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .desc { font: 500 14px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #0f172a; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .legend { font: 600 14px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1250" class="bg"/>
  <text x="850" y="52" text-anchor="middle" class="title">DevSecOps- Jenkins/Github Actions Pipeline (Stage-by-Stage)</text>
  <text x="850" y="82" text-anchor="middle" class="subtitle">Each block represents one Jenkins/Github Actions stage/job in execution sequence</text>

  <rect x="70" y="105" width="24" height="24" class="stage"/>
  <text x="105" y="122" class="legend">General</text>
  <rect x="220" y="105" width="24" height="24" class="stage stageSec"/>
  <text x="255" y="122" class="legend">Security Scan</text>
  <rect x="420" y="105" width="24" height="24" class="stage stageDeploy"/>
  <text x="455" y="122" class="legend">Build/Deploy</text>
  <rect x="620" y="105" width="24" height="24" class="stage stageInfra"/>
  <text x="655" y="122" class="legend">Infrastructure</text>

  <!-- Row 1 -->
  <rect x="70" y="170" width="360" height="105" class="stage"/>
  <text x="90" y="205" class="name">1. Checkout</text>
  <text x="90" y="230" class="desc">SCM checkout</text>

  <rect x="500" y="170" width="360" height="105" class="stage"/>
  <text x="520" y="205" class="name">2. Validate Prometheus Config</text>
  <text x="520" y="230" class="desc">Runs promtool check (if Docker exists)</text>

  <rect x="930" y="170" width="360" height="105" class="stage stageSec"/>
  <text x="950" y="205" class="name">3. Secret Scan (Gitleaks)</text>
  <text x="950" y="230" class="desc">Scans git history + workspace for hardcoded secrets</text>

  <rect x="1360" y="170" width="270" height="105" class="stage"/>
  <text x="1380" y="205" class="name">4. Unit Testing</text>
  <text x="1380" y="230" class="desc">npm ci + npm test</text>

  <!-- Row 2 -->
  <rect x="1360" y="355" width="270" height="105" class="stage"/>
  <text x="1380" y="390" class="name">5. Build &amp; Test</text>
  <text x="1380" y="415" class="desc">npm run lint + npm run build</text>

  <rect x="930" y="355" width="360" height="105" class="stage stageSec"/>
  <text x="950" y="390" class="name">6. Dependency Security Scan</text>
  <text x="950" y="415" class="desc">npm audit + Snyk dependencies</text>

  <rect x="500" y="355" width="360" height="105" class="stage stageDeploy"/>
  <text x="520" y="390" class="name">7. Docker Build &amp; Security Scan</text>
  <text x="520" y="415" class="desc">docker build/save + Trivy image scan</text>

  <rect x="70" y="355" width="360" height="105" class="stage stageSec"/>
  <text x="90" y="390" class="name">8. OWASP ZAP DAST Scan</text>
  <text x="90" y="415" class="desc">Runs baseline DAST scan against running app</text>

  <!-- Row 3 -->
  <rect x="70" y="540" width="360" height="105" class="stage stageInfra"/>
  <text x="90" y="575" class="name">9. Terraform Security Scan (Trivy)</text>
  <text x="90" y="600" class="desc">Trivy config scan for IaC misconfigurations</text>

  <rect x="500" y="540" width="360" height="105" class="stage stageDeploy"/>
  <text x="520" y="575" class="name">10. Deploy to Docker Hub</text>
  <text x="520" y="600" class="desc">docker login/tag/push using dynamic IMAGE_TAG</text>

  <rect x="930" y="540" width="360" height="105" class="stage stageDeploy"/>
  <text x="950" y="575" class="name">11. Update Kubernetes Deployment</text>
  <text x="950" y="600" class="desc">Updates image tag in deployment manifest and push</text>

  <rect x="1360" y="540" width="270" height="105" class="stage stageDeploy"/>
  <text x="1380" y="575" class="name">12. Argo CD Auto Sync</text>
  <text x="1380" y="600" class="desc">Detects Git manifest changes</text>
  <text x="1380" y="620" class="desc">and triggers sync</text>

  <rect x="1360" y="730" width="270" height="105" class="stage stageDeploy"/>
  <text x="1380" y="765" class="name">13. Kubernetes Rollout</text>
  <text x="1380" y="790" class="desc">Argo CD deploys and reconciles</text>
  <text x="1380" y="810" class="desc">cluster state</text>

  <!-- Flow arrows (snake layout) -->
  <path d="M430 222 L500 222" class="arrow"/>
  <path d="M860 222 L930 222" class="arrow"/>
  <path d="M1290 222 L1360 222" class="arrow"/>

  <path d="M1495 275 L1495 355" class="arrow"/>
  <path d="M1360 407 L1290 407" class="arrow"/>
  <path d="M930 407 L860 407" class="arrow"/>
  <path d="M500 407 L430 407" class="arrow"/>

  <path d="M250 460 L250 540" class="arrow"/>
  <path d="M430 592 L500 592" class="arrow"/>
  <path d="M860 592 L930 592" class="arrow"/>
  <path d="M1290 592 L1360 592" class="arrow"/>
  <path d="M1495 645 L1495 730" class="arrow"/>

  <!-- Optional context box -->
  <!-- <rect x="70" y="730" width="1560" height="430" class="stage"/>
  <text x="95" y="765" class="name">Project Context</text>
  <text x="95" y="795" class="desc">Source: GitHub repository</text>
  <text x="95" y="820" class="desc">Build Artifact: Docker image streamgen-ai:&lt;dynamic-tag&gt;</text>
  <text x="95" y="845" class="desc">Security Layers: Gitleaks, npm audit/Snyk, Trivy image, ZAP DAST, Trivy Terraform scan</text>
  <text x="95" y="870" class="desc">Deployment Output: Updated kubernetes/deployment.yaml with newly built image tag</text> -->
</svg>
